<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>简易钢琴</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  h1 { margin-bottom: 20px; }
  .piano { display: flex; gap: 4px; }
  .key { width: 60px; height: 200px; background: #fff; border-radius: 0 0 8px 8px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 15px; color: #333; font-weight: bold; font-size: 14px; transition: background 0.1s; }
  .key.active { background: #e94560; color: #fff; }
  .key span { font-size: 12px; opacity: 0.6; }
  .hint { margin-top: 25px; color: #aaa; font-size: 14px; }
</style>
</head>
<body>
<h1>🎹 简易钢琴</h1>
<div class="piano" id="piano"></div>
<p class="hint">按键盘 A S D F G H J K 弹奏 | 试试《小星星》：A A G G H H G</p>

<script>
const notes = [
  { key: 'a', note: 'C4', freq: 261.63, label: 'Do' },
  { key: 's', note: 'D4', freq: 293.66, label: 'Re' },
  { key: 'd', note: 'E4', freq: 329.63, label: 'Mi' },
  { key: 'f', note: 'F4', freq: 349.23, label: 'Fa' },
  { key: 'g', note: 'G4', freq: 392.00, label: 'Sol' },
  { key: 'h', note: 'A4', freq: 440.00, label: 'La' },
  { key: 'j', note: 'B4', freq: 493.88, label: 'Si' },
  { key: 'k', note: 'C5', freq: 523.25, label: 'Do' },
];

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const activeOscillators = {};

const piano = document.getElementById('piano');
notes.forEach(n => {
  const div = document.createElement('div');
  div.className = 'key';
  div.dataset.key = n.key;
  div.innerHTML = `${n.label}<span>${n.key.toUpperCase()}</span>`;
  piano.appendChild(div);
});

function playNote(freq, key) {
  if (activeOscillators[key]) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  activeOscillators[key] = { osc, gain };
  document.querySelector(`.key[data-key="${key}"]`)?.classList.add('active');
}

function stopNote(key) {
  const active = activeOscillators[key];
  if (!active) return;
  active.gain.gain.cancelScheduledValues(audioCtx.currentTime);
  active.gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
  active.osc.stop(audioCtx.currentTime + 0.15);
  delete activeOscillators[key];
  document.querySelector(`.key[data-key="${key}"]`)?.classList.remove('active');
}

document.addEventListener('keydown', e => {
  const n = notes.find(x => x.key === e.key.toLowerCase());
  if (n) playNote(n.freq, n.key);
});
document.addEventListener('keyup', e => stopNote(e.key.toLowerCase()));

document.querySelectorAll('.key').forEach(el => {
  el.addEventListener('mousedown', () => {
    const n = notes.find(x => x.key === el.dataset.key);
    if (n) playNote(n.freq, n.key);
  });
  el.addEventListener('mouseup', () => stopNote(el.dataset.key));
  el.addEventListener('mouseleave', () => stopNote(el.dataset.key));
});
</script>
</body>
</html>
